version: "3.9"

services:
  merlins-ide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: merlins-ide
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ide-data:/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/data/the-ide.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  ide-data:
    driver: local
